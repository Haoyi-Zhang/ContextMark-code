name: Finite scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-correspondence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p029-logs"
          timeout 120s python -B -m pip install --disable-pip-version-check --only-binary=:all: --retries 1 --timeout 30 -r requirements.txt 2>&1 | tee "$RUNNER_TEMP/p029-logs/dependencies.txt"
      - name: Run the bounded owned finite campaign
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 4194304
          ulimit -t 600
          ulimit -f 262144
          timeout --signal=TERM --kill-after=10s 600s python -B run_experiments.py --out "$RUNNER_TEMP/p029-evidence" 2>&1 | tee "$RUNNER_TEMP/p029-logs/campaign.txt"
          timeout 180s python -B verify_release.py --root . --evidence-dir "$RUNNER_TEMP/p029-evidence" --skip-tests 2>&1 | tee "$RUNNER_TEMP/p029-logs/verification.txt"
      - name: Retain raw output even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p029-finite-evidence
          path: |
            ${{ runner.temp }}/p029-logs
            ${{ runner.temp }}/p029-evidence
          if-no-files-found: warn
          retention-days: 14
